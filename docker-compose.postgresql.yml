services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_narrator
      POSTGRES_USER: game_narrator
      POSTGRES_PASSWORD: game_narrator
    ports:
      - "5432:5432"
    volumes:
      - game_narrator_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_narrator -d game_narrator"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: game_narrator
      MINIO_ROOT_PASSWORD: change-this-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - game_narrator_objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 game_narrator change-this-local-password; do sleep 2; done;
      mc mb --ignore-existing local/game-narrator;
      mc anonymous set none local/game-narrator"

volumes:
  game_narrator_postgres:
  game_narrator_objects:
