groups:
  - name: game-narrator
    rules:
      - alert: GameNarrator停止接收任务
        expr: game_narrator_accepting_tasks == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "磁盘容量不足，服务已停止接收新任务"
      - alert: GameNarrator磁盘空间低
        expr: game_narrator_storage_usable_bytes / game_narrator_storage_total_bytes < 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "素材存储目录可用空间低于 5%"
      - alert: GameNarrator任务队列积压
        expr: game_narrator_task_queue_size >= 8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "异步任务队列持续积压"
      - alert: GameNarrator堆内存压力高
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "JVM 堆内存使用率持续超过 90%"
      - alert: GameNarrator显存压力高
        expr: game_narrator_gpu_memory_total_bytes > 0 and game_narrator_gpu_memory_used_bytes / game_narrator_gpu_memory_total_bytes > 0.95
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GPU 显存使用率持续超过 95%"

