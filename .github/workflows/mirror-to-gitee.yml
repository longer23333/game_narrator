name: Mirror to Gitee

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'longer23333/game_narrator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is missing or empty. Add a Gitee personal access token with repo write access under Settings > Secrets and variables > Actions, or disable this workflow if both remotes are pushed manually."
            exit 1
          fi
          git remote add gitee "https://no-longer233:${GITEE_TOKEN}@gitee.com/no-longer233/game_narrator.git"
          git push gitee --all
          git push gitee --tags
