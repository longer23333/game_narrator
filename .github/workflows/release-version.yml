name: 验证候选版本并发布标签

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Web/Windows/Android 统一语义版本，例如 2.3.0'
        required: true
      android_version_code:
        description: '必须与候选提交中的 Android versionCode 一致；0 表示只校验语义版本'
        required: false
        default: '0'
      title:
        description: '中文发布标题'
        required: true
        default: '稳定性与功能更新'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 检查标签不存在
        shell: pwsh
        run: |
          if (git tag --list "v${{ inputs.version }}") { throw '发布标签已经存在' }
      - name: 校验候选提交版本
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          $pom = Get-Content -Raw -Encoding UTF8 pom.xml
          $version = [regex]::Match($pom, '<artifactId>game-narrator</artifactId>\s*<version>([^<]+)</version>').Groups[1].Value
          if ($version -ne $env:RELEASE_VERSION) { throw "候选提交版本 $version 与输入版本 $env:RELEASE_VERSION 不一致；请先提交统一版本更新" }
          $changelog = Get-Content -Raw -Encoding UTF8 release/CHANGELOG.json | ConvertFrom-Json
          if ($changelog.currentVersion -ne $env:RELEASE_VERSION -or $changelog.releases[0].title -ne $env:RELEASE_TITLE) { throw '候选提交的发布说明与输入不一致' }
          if ([int]$env:ANDROID_VERSION_CODE -gt 0) {
            $gradle = Get-Content -Raw -Encoding UTF8 android-app/app/build.gradle
            $code = [int]([regex]::Match($gradle, 'versionCode\s*=\s*(\d+)').Groups[1].Value)
            if ($code -ne [int]$env:ANDROID_VERSION_CODE) { throw "Android versionCode $code 与输入不一致" }
          }
          if (git status --porcelain) { throw '正式发布必须从干净的候选提交开始' }
      - name: 下载并校验同提交 CI 发布证据
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $run = gh run list --workflow ci.yml --commit $sha --status success --limit 1 --json databaseId,headSha,conclusion | ConvertFrom-Json
          if (-not $run -or $run[0].headSha -ne $sha -or $run[0].conclusion -ne 'success') { throw "当前提交 $sha 没有成功的 CI 运行" }
          gh run download $run[0].databaseId -n "ci-release-result-$sha"
          ./scripts/verify-ci-release-evidence.ps1
      - name: 校验统一版本和 Android 功能基线
        shell: pwsh
        run: |
          ./scripts/verify-release-alignment.ps1
          ./scripts/verify-android-guardrails.ps1
          ./scripts/verify-release-performance-evidence.ps1
      - name: 构建并校验 Web 与后端发布包
        shell: pwsh
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/updates.js
          ./mvnw.cmd -q test
          ./mvnw.cmd -q package -DskipTests
      - name: 构建并校验 Android release 包
        shell: pwsh
        env:
          GN_KEYSTORE_PASSWORD: ${{ secrets.GN_KEYSTORE_PASSWORD }}
          GN_KEY_ALIAS: ${{ secrets.GN_KEY_ALIAS }}
          GN_KEY_PASSWORD: ${{ secrets.GN_KEY_PASSWORD }}
          GN_KEYSTORE_BASE64: ${{ secrets.GN_KEYSTORE_BASE64 }}
          ANDROID_DEVICE_EVIDENCE_BASE64: ${{ secrets.ANDROID_DEVICE_EVIDENCE_BASE64 }}
        run: |
          ./android-app/gradlew.bat -p android-app testDebugUnitTest
          ./scripts/verify-android-release-audit.ps1
          if (-not $env:GN_KEYSTORE_BASE64) { throw '未配置 GN_KEYSTORE_BASE64' }
          $keystore = Join-Path $env:RUNNER_TEMP 'game-narrator-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:GN_KEYSTORE_BASE64))
          $env:GN_KEYSTORE = $keystore
          ./scripts/build-android-release-signed.ps1 -SkipTests
          ./scripts/verify-android-production-release.ps1 -RequireProductionArtifacts
          if (-not $env:ANDROID_DEVICE_EVIDENCE_BASE64) { throw '未配置 ANDROID_DEVICE_EVIDENCE_BASE64' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          [IO.File]::WriteAllBytes('artifacts/android-platform-import-e2e.json', [Convert]::FromBase64String($env:ANDROID_DEVICE_EVIDENCE_BASE64))
          ./scripts/verify-android-platform-import.ps1 -RequireDeviceEvidence
      - name: 上传 Web 与 Android 统一版本产物
        uses: actions/upload-artifact@v4
        with:
          name: GameNarrator-${{ inputs.version }}-Web-Android
          if-no-files-found: error
          path: |
            target/game-narrator-${{ inputs.version }}.jar
            dist/GameNarrator-Android-${{ inputs.version }}-release-signed.apk
            dist/GameNarrator-Android-${{ inputs.version }}-manifest.json
            dist/GameNarrator-Android-${{ inputs.version }}-certificate.txt
            dist/GameNarrator-Android-${{ inputs.version }}-r8/**
      - name: 为已验证候选提交创建中文发布标签
        shell: pwsh
        run: |
          git config user.name 'GameNarrator Release Bot'
          git config user.email 'release-bot@users.noreply.github.com'
          if (git status --porcelain) { throw '构建过程修改了受版本控制文件，拒绝发布' }
          git tag -a "v${{ inputs.version }}" -m "GameNarrator v${{ inputs.version }}：${{ inputs.title }}"
          git push origin "v${{ inputs.version }}"
      - name: 同步提交和标签到 Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if (-not $env:GITEE_TOKEN) { throw '未配置 GITEE_TOKEN' }
          git remote add gitee "https://no-longer233:$env:GITEE_TOKEN@gitee.com/no-longer233/game_narrator.git"
          git push gitee HEAD:main
          git push gitee "v${{ inputs.version }}"
