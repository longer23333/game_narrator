name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated migration baselines
        shell: pwsh
        run: ./scripts/build-migration-baselines.ps1 -Check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify parity, versions and Android guardrails
        shell: pwsh
        run: |
          ./scripts/verify-release-alignment.ps1
          ./scripts/verify-android-guardrails.ps1
      - name: Test and assemble Android release
        run: |
          chmod +x android-app/gradlew
          android-app/gradlew -p android-app testDebugUnitTest assembleRelease

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests including the real pipeline
        run: |
          chmod +x mvnw
          ./mvnw test
