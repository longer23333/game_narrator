name: Test

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 18 * * 6'

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated migration baselines
        shell: pwsh
        run: ./scripts/build-migration-baselines.ps1 -Check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify parity, versions and Android guardrails
        shell: pwsh
        run: |
          ./scripts/verify-release-alignment.ps1
          ./scripts/verify-android-guardrails.ps1
      - name: Test and assemble Android release
        shell: pwsh
        run: |
          chmod +x android-app/gradlew
          android-app/gradlew -p android-app testDebugUnitTest
          ./scripts/verify-android-release-audit.ps1

  android-emulator:
    name: Android emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run core instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-app
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=cn.longer233.gamenarrator.mobile.AiCloudSettingsTest,cn.longer233.gamenarrator.mobile.MobileModelBundlerTest,cn.longer233.gamenarrator.mobile.OnnxModelRunnerTest,cn.longer233.gamenarrator.mobile.ProductionDatabaseTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            android-app/app/build/reports/androidTests/connected/
            android-app/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests including the real pipeline
        run: |
          chmod +x mvnw
          ./mvnw test

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify performance suite contract
        shell: pwsh
        run: ./scripts/verify-performance-suite.ps1
      - name: Run concurrent API and heap baseline
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=ConcurrentApiPerformanceTest test

  long-video-performance:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run five-minute 1080p performance gate
        env:
          RUN_LONG_VIDEO_PERFORMANCE: 'true'
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=LongVideoPerformanceIT test
