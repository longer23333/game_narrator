name: Test

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 18 * * 6'

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated migration baselines
        shell: pwsh
        run: ./scripts/build-postgresql-migrations.ps1 -Check

  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation against source
        shell: pwsh
        run: ./scripts/verify-documentation.ps1
      - name: Verify local model management contract
        shell: pwsh
        run: ./scripts/verify-local-model-management.ps1
      - name: Verify startup reconciliation and orphan GC
        shell: pwsh
        run: ./scripts/verify-startup-reconciliation.ps1
      - name: Verify parameterized timeline transitions
        shell: pwsh
        run: ./scripts/verify-timeline-transitions.ps1
      - name: Verify render work lifecycle
        shell: pwsh
        run: ./scripts/verify-render-work-cleanup.ps1
      - name: Verify meme timeline slots
        shell: pwsh
        run: ./scripts/verify-meme-timeline-slots.ps1
      - name: Verify licensed SFX library
        shell: pwsh
        run: ./scripts/verify-licensed-sfx-library.ps1
      - name: Verify speaker diarization contract
        shell: pwsh
        run: ./scripts/verify-speaker-diarization.ps1
      - name: Verify event-driven frame sampling
        shell: pwsh
        run: ./scripts/verify-event-driven-frame-sampling.ps1
      - name: Verify Android LUT contract
        shell: pwsh
        run: ./scripts/verify-android-lut.ps1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify parity, versions and Android guardrails
        shell: pwsh
        run: |
          ./scripts/verify-release-alignment.ps1
          ./scripts/verify-android-guardrails.ps1
          ./scripts/verify-android-device-farm.ps1
      - name: Test and assemble Android release
        shell: pwsh
        run: |
          chmod +x android-app/gradlew
          android-app/gradlew -p android-app testDebugUnitTest
          ./scripts/verify-android-release-audit.ps1

  android-emulator:
    name: Android emulator API ${{ matrix.api-level }} blocking tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enable Gradle wrapper execution
        run: chmod +x android-app/gradlew
      - name: Run core instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-app
          script: >-
            ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=cn.longer233.gamenarrator.mobile.AiCloudSettingsTest,cn.longer233.gamenarrator.mobile.MobileModelBundlerTest,cn.longer233.gamenarrator.mobile.OnnxModelRunnerTest,cn.longer233.gamenarrator.mobile.ProductionDatabaseTest,cn.longer233.gamenarrator.mobile.RemoteMediaImporterReplayTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            android-app/app/build/reports/androidTests/connected/
            android-app/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  android-upgrade:
    name: Android 2.2.4 to current persistent AVD upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: v2.2.4
          path: android-2.2.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build baseline, current app and verification APK
        run: |
          chmod +x android-2.2.4/android-app/gradlew android-app/gradlew
          android-2.2.4/android-app/gradlew -p android-2.2.4/android-app assembleDebug
          android-app/gradlew -p android-app assembleDebug assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the same persistent emulator and verify app data
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install android-2.2.4/android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n cn.longer233.gamenarrator.mobile/.MainActivity
            adb shell am force-stop cn.longer233.gamenarrator.mobile
            adb shell run-as cn.longer233.gamenarrator.mobile ls databases/game-narrator-mobile.db
            adb shell run-as cn.longer233.gamenarrator.mobile sh -c 'echo upgrade-sentinel > files/upgrade-sentinel.txt'
            adb install -r android-app/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as cn.longer233.gamenarrator.mobile grep upgrade-sentinel files/upgrade-sentinel.txt
            adb install -r android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class cn.longer233.gamenarrator.mobile.ProductionDatabaseTest cn.longer233.gamenarrator.mobile.test/androidx.test.runner.AndroidJUnitRunner
            adb shell run-as cn.longer233.gamenarrator.mobile grep upgrade-sentinel files/upgrade-sentinel.txt

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests including the real pipeline
        run: |
          chmod +x mvnw
          ./mvnw test

  postgresql-integration:
    name: PostgreSQL production-path integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: game_narrator_ci
          POSTGRES_USER: game_narrator_ci
          POSTGRES_PASSWORD: ci-postgresql-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game_narrator_ci -d game_narrator_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run migrations and production-path integrity checks on PostgreSQL 16
        env:
          RUN_POSTGRESQL_INTEGRATION: 'true'
          POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/game_narrator_ci
          POSTGRES_USER: game_narrator_ci
          POSTGRES_PASSWORD: ci-postgresql-password
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=PostgreSqlProductionIntegrationTest test

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify performance suite contract
        shell: pwsh
        run: ./scripts/verify-performance-suite.ps1
      - name: Run concurrent API and heap baseline
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=ConcurrentApiPerformanceTest test

  long-video-performance:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[performance]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run five-minute 1080p performance gate
        env:
          RUN_LONG_VIDEO_PERFORMANCE: 'true'
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=LongVideoPerformanceIT test

  release-evidence:
    name: Publish same-commit CI release evidence
    if: github.event_name == 'push'
    needs: [migration-baseline, documentation, frontend, android, android-emulator, android-upgrade, backend, postgresql-integration, performance-baseline]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create passed CI evidence
        shell: pwsh
        run: ./scripts/new-ci-release-evidence.ps1 -Commit '${{ github.sha }}' -RunId '${{ github.run_id }}' -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Upload CI release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-result-${{ github.sha }}
          path: artifacts/ci-release-result.json
          if-no-files-found: error
          retention-days: 30
