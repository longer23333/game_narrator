<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>GameNarrator 浏览器助手安装说明</title><style>
body{max-width:760px;margin:40px auto;padding:0 20px;color:#1f2937;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}h1{color:#465fff}.tip{padding:12px;background:#eef1ff;border-radius:8px}
</style></head><body><h1>GameNarrator 浏览器助手怎么安装</h1><ol>
<li>下载并解压扩展 ZIP。</li>
<li>在 Chrome 打开 <code>chrome://extensions</code>，Edge 打开 <code>edge://extensions</code>。</li>
<li>开启“开发者模式”，点击“加载已解压的扩展程序”。</li>
<li>选择能直接看到 <code>manifest.json</code> 的文件夹。</li>
<li>回到 GameNarrator，点击扩展图标并选择“连接当前网站”。</li>
</ol><p class="tip">扩展只同步 Bilibili 推荐与搜索候选，不读取 Cookie，也不自动下载内容。URL 下载统一由 yt-dlp 处理。</p></body></html>
