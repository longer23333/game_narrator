spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/game_narrator}
    username: ${POSTGRES_USER:game_narrator}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration-postgresql

# Activate with: --spring.profiles.active=postgresql
game-narrator:
  security:
    master-key: ${GAME_NARRATOR_SECRET_KEY:}
    master-key-version: ${GAME_NARRATOR_SECRET_KEY_VERSION:v1}
    previous-master-keys: ${GAME_NARRATOR_PREVIOUS_SECRET_KEYS:}
  auth:
    require-login: ${REQUIRE_LOGIN:true}
  cloud-sync:
    enabled: ${CLOUD_SYNC_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:game-narrator}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
    interval-ms: 5000
    retry:
      max-attempts: ${CLOUD_SYNC_MAX_ATTEMPTS:8}
      base-delay-seconds: ${CLOUD_SYNC_RETRY_BASE_SECONDS:30}
      max-delay-seconds: ${CLOUD_SYNC_RETRY_MAX_SECONDS:3600}
      jitter-ratio: ${CLOUD_SYNC_RETRY_JITTER_RATIO:0.2}
    multipart-threshold-bytes: 67108864
    multipart-part-bytes: 16777216
